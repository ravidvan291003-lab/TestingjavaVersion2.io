<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cheeseSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="#FFFBEB" rx="24"/>
  <circle cx="150" cy="150" r="110" fill="#FEF3C7" opacity="0.8"/>
  <!-- Cheese wedge 3D -->
  <!-- Top surface -->
  <polygon points="150,70 235,165 75,185" fill="url(#cheeseGrad)" stroke="#B45309" stroke-width="2"/>
  <!-- Front side -->
  <polygon points="75,185 235,165 235,215 75,235" fill="url(#cheeseSide)" stroke="#92400E" stroke-width="2"/>
  <!-- Holes on top -->
  <ellipse cx="140" cy="130" rx="12" ry="7" fill="#D97706" opacity="0.6"/>
  <ellipse cx="180" cy="140" rx="8" ry="5" fill="#D97706" opacity="0.6"/>
  <ellipse cx="110" cy="165" rx="9" ry="5" fill="#D97706" opacity="0.6"/>
  <!-- Holes on front -->
  <circle cx="115" cy="205" r="8" fill="#78350F" opacity="0.7"/>
  <circle cx="165" cy="195" r="6" fill="#78350F" opacity="0.7"/>
  <circle cx="205" cy="185" r="7" fill="#78350F" opacity="0.7"/>
  <!-- Label tag -->
  <rect x="90" y="245" width="120" height="24" rx="6" fill="#1E293B"/>
  <text x="150" y="261" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle">AGED CHEDDAR 250g</text>
</svg>
